spring.application.name=purchase-service
server.port=8082

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/zszq?connectionTimeZone=UTC&sslMode=DISABLED&allowPublicKeyRetrieval=true
spring.datasource.username=zszq
spring.datasource.password=${MYSQL_PASSWORD:zszq_local}
spring.datasource.hikari.connection-timeout=3000
spring.sql.init.mode=never

spring.rabbitmq.host=${RABBITMQ_HOST:127.0.0.1}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=zszq
spring.rabbitmq.password=${RABBITMQ_PASSWORD:zszq_local}
spring.rabbitmq.connection-timeout=3s
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
