spring.application.name=activity-service
server.port=8081

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/zszq?connectionTimeZone=UTC&sslMode=DISABLED&allowPublicKeyRetrieval=true
spring.datasource.username=zszq
spring.datasource.password=${MYSQL_PASSWORD:zszq_local}
spring.datasource.hikari.connection-timeout=3000
spring.sql.init.mode=never

management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
