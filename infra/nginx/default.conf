resolver 127.0.0.11 valid=5s ipv6=off;

map $http_x_request_id $correlation_id {
    default $http_x_request_id;
    "" $request_id;
}

log_format reservation escape=json '{"requestId":"$correlation_id","method":"$request_method",'
    '"path":"$uri","status":$status,"upstream":"$upstream_addr","seconds":$request_time}';

upstream activities {
    zone activities 64k;
    server activity-service:8080 resolve;
}

upstream purchases {
    zone purchases 64k;
    server purchase-service:8080 resolve;
}

upstream orders {
    zone orders 64k;
    server order-service:8080 resolve;
}

upstream mock-ta {
    zone mock-ta 64k;
    server mock-ta-service:8080 resolve;
}

server {
    listen 8080;
    server_name _;
    access_log /var/log/nginx/access.log reservation;
    proxy_set_header X-Request-Id $correlation_id;

    location = /health/activity {
        proxy_pass http://activities/actuator/health/readiness;
    }
    location = /health/purchase {
        add_header X-Upstream-Address $upstream_addr;
        proxy_pass http://purchases/actuator/health/readiness;
    }
    location = /health/order {
        proxy_pass http://orders/actuator/health/readiness;
    }
    location = /health/ta {
        proxy_pass http://mock-ta/actuator/health/readiness;
    }

    location ~ ^/api/activities/[^/]+/purchases(?:/|$) {
        proxy_pass http://purchases;
    }
    location /api/activities {
        proxy_pass http://activities;
    }
    location / {
        return 404;
    }
}
